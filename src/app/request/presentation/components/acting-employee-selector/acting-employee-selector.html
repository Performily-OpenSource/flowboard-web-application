<button class="acting" type="button" [matMenuTriggerFor]="actingMenu" [matTooltip]="'acting.hint' | translate">
  <mat-icon aria-hidden="true">badge</mat-icon>
  <span>{{ 'acting.label' | translate }}:</span>
  <strong>{{ store.actingEmployee()?.fullName ?? '-' }}</strong>
  @if (store.actingEmployee()?.hrStaff) {
    <span class="tag">{{ 'acting.hr' | translate }}</span>
  }
  <mat-icon aria-hidden="true">expand_more</mat-icon>
</button>
<mat-menu #actingMenu="matMenu">
  @for (requester of store.activeRequesters(); track requester.id) {
    <button mat-menu-item (click)="store.setActingEmployee(requester.id)">
      {{ requester.fullName }} · {{ requester.positionTitle }}
    </button>
  }
</mat-menu>
