<div class="dialog">
  <header class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">{{ 'return-dialog.title' | translate }}</h2>
    <button class="icon-action" type="button" mat-dialog-close [attr.aria-label]="'common.close' | translate"><mat-icon>close</mat-icon></button>
  </header>
  <app-requester-summary-card [requester]="requester()" [rows]="rows()"/>
  <div class="field" [formGroup]="form">
    <label for="returnComment">{{ 'return-dialog.comment' | translate }}</label>
    <textarea id="returnComment" class="input" maxlength="500" formControlName="comment" [class.invalid]="isInvalidControl(form, 'comment')"
              [placeholder]="'return-dialog.comment-placeholder' | translate"></textarea>
    @if (isInvalidControl(form, 'comment')) {
      <p class="field-error">{{ 'return-dialog.comment-required' | translate }}</p>
    }
  </div>
  <div class="info-note">
    <mat-icon aria-hidden="true">info</mat-icon>
    <span>{{ 'return-dialog.info' | translate }}</span>
  </div>
  @if (store.error(); as error) {
    <div class="error-banner" role="alert"><mat-icon>error</mat-icon><span>{{ error.key | translate: error.params }}</span></div>
  }
  <div class="dialog-actions">
    <button mat-stroked-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button type="button" (click)="confirm()">
      <mat-icon>undo</mat-icon>
      {{ 'return-dialog.confirm' | translate }}
    </button>
  </div>
</div>
