<div class="pagination">
  <span class="summary">
    {{ 'pagination.showing' | translate: { from: from(), to: to(), total: total(), items: (itemsKey() | translate) } }}
  </span>
  <span class="spacer"></span>
  <button class="page-button" type="button" [disabled]="page() === 0" (click)="page.set(page() - 1)">
    {{ 'pagination.previous' | translate }}
  </button>
  @for (item of pages(); track $index) {
    @if (item === null) {
      <span class="page-gap" aria-hidden="true">…</span>
    } @else {
      <button class="page-button" type="button" [class.current]="item === page()"
              [attr.aria-current]="item === page() ? 'page' : null" (click)="page.set(item)">{{ item + 1 }}</button>
    }
  }
  <button class="page-button" type="button" [disabled]="page() >= pageCount() - 1" (click)="page.set(page() + 1)">
    {{ 'pagination.next' | translate }}
  </button>
</div>
