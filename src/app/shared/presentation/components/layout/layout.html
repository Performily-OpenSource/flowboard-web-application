<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav class="sidebar"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="!isHandset()">
    <a class="brand" routerLink="/home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="brand-name">Flowboard</span>
    </a>
    <nav class="nav" [attr.aria-label]="'option.main-navigation' | translate">
      @for (option of visibleOptions(); track option.link) {
        <a class="nav-item" [class.active]="isActive(option)" [routerLink]="option.link"
           [attr.aria-current]="isActive(option) ? 'page' : null"
           (click)="isHandset() && sidenav.close()">
          <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
          <span>{{ option.label | translate }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="main">
    <app-toolbar [showMenuButton]="isHandset()"
                 (menuToggle)="sidenav.toggle()"
                 (searchSubmit)="searchEmployees($event)"/>
    <main class="content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
